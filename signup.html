<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CampusHub</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <main class="signup-page">

        <div class="signup-container">

            <!-- Logo -->
            <a href="index.html" class="signup-logo">
                <span class="logo-icon">C</span>
                <span>CampusHub</span>
            </a>


            <!-- Heading -->
            <div class="signup-header">

                <h1>Create your account</h1>

                <p>
                    Join CampusHub and discover what's happening around you.
                </p>

            </div>


            <!-- Signup Form -->
            <form class="signup-form" id="signup-form" novalidate>


                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                    <p class="error-message" id="name-error"></p>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <p class="error-message" id="email-error"></p>

                </div>


                <!-- College -->
                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college"
                        autocomplete="organization"
                    >

                    <p class="error-message" id="college-error"></p>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <p class="password-hint">
                        Use at least 6 characters.
                    </p>

                    <p class="error-message" id="password-error"></p>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="confirm-password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <p class="error-message" id="confirm-password-error"></p>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>


                <!-- Success Message -->
                <p
                    class="success-message"
                    id="success-message"
                ></p>

            </form>


            <!-- Login -->
            <p class="login-text">

                Already have an account?

                <a href="signin.html">
                    Sign in
                </a>

            </p>

        </div>

    </main>


    <script src="signup.js"></script>

</body>

</html>
