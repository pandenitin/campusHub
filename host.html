<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Host an Event | CampusHub</title>

    <link rel="stylesheet" href="host.css">
</head>

<body>

    <main class="host-page">

        <div class="host-container">

            <!-- Logo -->

            <a href="index.html" class="host-logo">
                <span class="logo-icon">C</span>
                <span>CampusHub</span>
            </a>


            <!-- Header -->

            <div class="host-header">

                <h1>Host an Event</h1>

                <p>
                    Share your event with students across Mumbai.
                </p>

            </div>


            <!-- Event Form -->

            <form class="host-form" id="host-form" novalidate>

                <!-- Event Name -->

                <div class="form-group">

                    <label for="event-name">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="event-name"
                        placeholder="Enter event name"
                    >

                    <p class="error-message" id="event-name-error"></p>

                </div>


                <!-- College -->

                <div class="form-group">

                    <label for="college">
                        College / Organization
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter college or organization"
                    >

                    <p class="error-message" id="college-error"></p>

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="">
                            Select a category
                        </option>

                        <option value="Hackathons">
                            Hackathons
                        </option>

                        <option value="Workshops">
                            Workshops
                        </option>

                        <option value="Competitions">
                            Competitions
                        </option>

                        <option value="Tech">
                            Tech
                        </option>

                        <option value="Design">
                            Design
                        </option>

                        <option value="Entrepreneurship">
                            Entrepreneurship
                        </option>

                    </select>

                    <p class="error-message" id="category-error"></p>

                </div>


                <!-- Date and Location -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="event-date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="event-date"
                        >

                        <p class="error-message" id="date-error"></p>

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            placeholder="e.g. Andheri"
                        >

                        <p class="error-message" id="location-error"></p>

                    </div>

                </div>


                <!-- Entry Fee -->

                <div class="form-group">

                    <label for="fee">
                        Entry Fee
                    </label>

                    <input
                        type="number"
                        id="fee"
                        placeholder="Enter fee (0 for free)"
                        min="0"
                    >

                    <p class="error-message" id="fee-error"></p>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Event Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Tell students what your event is about..."
                        rows="5"
                    ></textarea>

                    <p class="error-message" id="description-error"></p>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="host-submit"
                >
                    Create Event
                </button>

                <p
                    class="success-message"
                    id="success-message"
                ></p>

            </form>


            <!-- Back -->

            <p class="back-text">

                <a href="Index.html">
                    ← Back to CampusHub
                </a>

            </p>

        </div>

    </main>


    <script src="host.js"></script>

</body>

</html>
